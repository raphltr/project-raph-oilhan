name: Bug
description: Something doesn't work as expected
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where (web / mobile / API / agent, environment)
