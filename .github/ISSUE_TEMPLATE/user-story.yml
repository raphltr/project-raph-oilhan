name: User story
description: A feature described from the user's point of view
title: "Story: "
labels: [user-story]
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      description: As a <role>, I want <goal>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given … When … Then …
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [Must, Should, Could]
    validations:
      required: true
